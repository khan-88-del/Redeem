name: Build Godot 4 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  export_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Build Tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Generate Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Install Godot & Templates
        run: |
          GODOT_VERSION="4.2.2-stable"

          # 1. Godot Binary
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          # 2. Templates
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.2.2.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"
          rm -f Godot_v${GODOT_VERSION}_export_templates.tpz

      - name: Configure Godot Editor Settings
        run: |
          CONFIG_PATH="$HOME/.config/godot"
          mkdir -p "$CONFIG_PATH"
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))

          cat << EOF > "$CONFIG_PATH/editor_settings-4.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/force_system_user = false
          export/android/adb_path = "$ANDROID_SDK_ROOT/platform-tools/adb"
          EOF

      - name: Export Android APK
        run: |
          mkdir -p build/
          godot --headless --export-debug "Android" build/FreeFireClone.apk

      - name: Upload Game APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-Godot-Online-APK
          path: build/FreeFireClone.apk
          retention-days: 7
