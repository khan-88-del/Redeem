name: Build Godot 4 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  export_android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Keystore & Configure Godot Paths
        run: |
          # 1. Create debug keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /github/workspace/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

          # 2. Setup Godot Templates in GitHub Home
          TEMPLATE_DIR="/github/home/.local/share/godot/export_templates/4.2.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -f Godot_v4.2.2-stable_export_templates.tpz

          # 3. Find correct Java and Android paths in container
          SDK_PATH="/opt/android-sdk"
          JAVA_BIN=$(which java)
          JAVA_DIR=$(dirname $(dirname $(readlink -f $JAVA_BIN)))

          # 4. Generate clean editor_settings-4.tres
          CONFIG_DIR="/github/home/.config/godot"
          mkdir -p "$CONFIG_DIR"
          cat << EOF > "$CONFIG_DIR/editor_settings-4.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "/github/workspace/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/force_system_user = false
          export/android/adb_path = "$SDK_PATH/platform-tools/adb"
          EOF

      - name: Export Android APK
        run: |
          mkdir -v -p build
          godot -v --headless --export-debug "Android" build/FreeFireClone.apk

      - name: Upload Game APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-Godot-Online-APK
          path: build/FreeFireClone.apk
          retention-days: 7
