name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Safely Generate Android Scaffold
        run: |
          flutter create --project-name=payvoucher --platforms=android /tmp/temp_app
          cp -r /tmp/temp_app/android ./android
          rm -rf /tmp/temp_app

      - name: Enable Android Internet Permission
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Project Dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Upload PayVoucher APK
        uses: actions/upload-artifact@v4
        with:
          name: PayVoucher-Release-v1.0.1
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
